<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="icon" type="image/x-icon" href="./assets/images/favicon.ico">

</head>
<body>

    <header>
    </header>

    <main class="container" style="justify-content: center; display: flex;">
        
        <div class="main-content" style="flex: 1; max-width: 600px;">
            <section class="card" style="text-align: center;">
                <h1 style="font-family: 'Titan One', sans-serif; font-size: 3rem; color: #38bdf8; margin: 0; line-height: 1; text-shadow: -2px -2px 0 #1e3a8a, 2px -2px 0 #1e3a8a, -2px 2px 0 #1e3a8a, 2px 2px 0 #1e3a8a;">404</h1>

    <footer>

        </div>
    </footer>

<audio id="bg-music" loop>
    <source src="./assets/music/peak.mp3" type="audio/mpeg">
</audio>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const music = document.getElementById("bg-music");
    music.volume = 0.3;

    const savedTime = localStorage.getItem("music_timestamp");
    if (savedTime) {
        music.currentTime = parseFloat(savedTime);
    }

    setInterval(() => {
        if (!music.paused) {
            localStorage.setItem("music_timestamp", music.currentTime);
        }
    }, 1000);

    music.play().catch(() => {
        const startAudioOnInteraction = () => {
            music.play();
            document.removeEventListener("click", startAudioOnInteraction);
            document.removeEventListener("keydown", startAudioOnInteraction);
        };

        document.addEventListener("click", startAudioOnInteraction);
        document.addEventListener("keydown", startAudioOnInteraction);
    });

    window.addEventListener("beforeunload", () => {
        localStorage.setItem("music_timestamp", music.currentTime);
    });
});
</script>

</body>
</html>
